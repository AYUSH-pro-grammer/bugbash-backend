[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

dependencies = [
  # Core
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "starlette==1.0.0",

  # Validation
  "pydantic==2.13.3",
  "typing_extensions==4.15.0",
  "email-validator==2.3.0",

  # Async / HTTP
  "anyio==4.13.0",
  "httpx==0.28.1",
  "requests==2.33.1",

  # Database
  "SQLAlchemy==2.0.49",
  "psycopg2-binary==2.9.12",

  # Auth
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",  # 🔥 FIX (5.0 breaks passlib sometimes)
  "python-jose[cryptography]==3.5.0",
  "cryptography==47.0.0",

  # AI (ONLY what you actually use)
  "google-generativeai==0.8.6",

  # Optional (if you really use them)
  "openai==2.32.0",
  "groq==1.2.0",
]